# 已公告但健保署「藥品給付規定」PDF 尚未更新的規定。
#
# 為什麼需要這份檔：本站的改版偵測依賴健保署章節 PDF 的檔名日期。
# 健保署發布政策公告到實際更新條文 PDF 之間有時間落差，這段期間醫師看到的
# 是舊條文。落差程式偵測不到（開放資料平台沒有公告資料集），只能人工記錄；
# 記在這裡的章節，UI 會顯示醒目提示，並且每次更新都強制重抓比對雜湊。
#
# ★ 章節一旦真的更新，務必把它從 pending 移到 resolved —— 否則 UI 會對一個
#   已經是現行版本的條文繼續掛「官方尚未更新」的警告，比沒有提示更糟。
#   validate.py gate 42 會擋下這種情況。
version: 1

pending: []

resolved:
  - section: "2.6.1."
    title: 降血脂藥物給付規定擴大
    effective: "2026-09-01"
    landed: "2026-09-20"
    note: >-
      健保署公告自 115/9/1 起依 ASCVD 風險分級調整 LDL-C 起始治療值與目標值，
      並擴大 statin、ezetimibe 及其複方之給付。
    outcome: >-
      2026-09-20 官方已換上 2.6.1._20260901.pdf（標題版次列入 115/9/1，
      新增「表一／表二」雙表結構）。同批換版的還有 2.6.2.、2.6.3.。
      追蹤過程中發現真正的破綻不在公告落差，而在開放資料主檔：
      健保署換檔時會同時下架舊檔，但 CSV 的「給付規定章節連結」是月更快照，
      仍指向已不存在的舊檔名 —— 照 CSV 抓一律 HTTP 400，而且檔名沒變，
      增量模式會判成「未異動」跳過。現已改為每次更新都向官方查詢 API
      核對現行檔名（etl/lib/nhi_live.py），不再依賴這份人工清單抓改版。
