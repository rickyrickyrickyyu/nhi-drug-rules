# 已公告但健保署「藥品給付規定」PDF 尚未更新的規定。
#
# 為什麼需要這份檔：本站的改版偵測依賴健保藥品主檔裡的條文 PDF 檔名日期。
# 健保署發布政策公告到實際更新條文 PDF 之間有時間落差 —— 實測 2026-09-01
# 生效的降血脂擴大給付已見諸新聞與衛福部新聞稿，但 2.6.1. 的條文檔仍是
# 2021-03-29 版、內文最新修訂日期停在 108/2/1。
#
# 這種落差程式偵測不到（開放資料平台沒有公告資料集），只能人工記錄。
# 記在這裡的章節，UI 會顯示醒目提示，避免醫師誤以為看到的是現行規定。
version: 1

pending:
  - section: "2.6.1."
    title: 降血脂藥物給付規定擴大
    effective: "2026-09-01"
    note: >-
      健保署公告自 115/9/1 起依 ASCVD 風險分級調整 LDL-C 起始治療值與目標值，
      並擴大 statin、ezetimibe 及其複方之給付（首波 57 品項）。
      本站顯示的 2.6.1. 條文仍為舊版（檔名 2021-03-29、內文最新修訂 108/2/1），
      健保署尚未更新該節之給付規定 PDF。
    source: 衛生福利部新聞稿與媒體報導（2026-08-31）
    checked: "2026-09-02"
    verified: >-
      2026-09-02 複查：健保署現行條文 PDF 最新僅到 2026-08-01，無任何 9 月生效章節；
      statin 品項仍指向 2.6.1._20210329.pdf；即時抓回該檔與本站快照
      sha256 逐位元組相同（bd7e96e5…）。生效日已過但官方條文仍未更新。
      fetch_rule_pdfs.py 現在每次都會強制重抓本清單的章節比對雜湊，
      官方一改檔就會在「本次異動」中出現。
