  AMPHOTERICIN: AMPHOTERICIN B
  TERBINAFIN: TERBINAFINE
  VITAMIN A ACID: TRETINOIN
  RETINOIC ACID: TRETINOIN
  CALCIPOTRIENE: CALCIPOTRIOL
  BETAMETHASONE 17-VALERATE: BETAMETHASONE (VALERATE)
